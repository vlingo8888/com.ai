name: Release

# Builds the Rust engine for every supported platform, publishes the
# @com.ai.vn/compiler-<platform>-<arch> packages, then publishes @com.ai.vn/cli.
# Trigger by pushing a tag that matches package.json version, e.g. `git push origin v1.0.3`.
# Requires the NPM_TOKEN repository secret (automation token with publish rights to @com.ai.vn).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-compiler:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, rust: aarch64-apple-darwin, target: darwin-arm64, bin: com-compiler }
          - { os: macos-14, rust: x86_64-apple-darwin, target: darwin-x64, bin: com-compiler }
          - { os: ubuntu-22.04, rust: x86_64-unknown-linux-gnu, target: linux-x64, bin: com-compiler }
          - { os: ubuntu-22.04-arm, rust: aarch64-unknown-linux-gnu, target: linux-arm64, bin: com-compiler }
          - { os: windows-2022, rust: x86_64-pc-windows-msvc, target: win32-x64, bin: com-compiler.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler-rs
          key: ${{ matrix.rust }}
      - name: Build com-compiler
        working-directory: compiler-rs
        run: cargo build --profile dist --target ${{ matrix.rust }} --bin com-compiler
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p staged/${{ matrix.target }}
          cp compiler-rs/target/${{ matrix.rust }}/dist/${{ matrix.bin }} staged/${{ matrix.target }}/
      - uses: actions/upload-artifact@v4
        with:
          name: compiler-${{ matrix.target }}
          path: staged/

  publish:
    needs: build-compiler
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $PKG_VERSION"; exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: compiler-*
          path: binaries
          merge-multiple: true
      - run: bun install --frozen-lockfile
      - run: bun test
      - name: Assemble platform packages
        run: bun scripts/build-platform-packages.ts binaries dist-npm
      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in dist-npm/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "↷ $name@$version already published"
            else
              npm publish "$dir" --access public
            fi
          done
      - name: Publish @com.ai.vn/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
