[package]
name = "compiler-rs"
version = "0.1.0"
edition = "2021"
description = "High-performance App Router & Server Actions compiler & preview server for Com.AI.VN / NATA"

[lib]
name = "compiler_rs"
path = "src/lib.rs"

[[bin]]
name = "com-compiler"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
regex = "1.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
walkdir = "2.5"
lightningcss = "1.0.0-alpha.72"
mimalloc = { version = "0.1", default-features = false }
blake3 = "1"
redb = "2"
notify = "6.1"
swc_core = { version = "79.0.0", features = [
    "common",
    "ecma_ast",
    "ecma_visit",
    "ecma_parser",
    "ecma_parser_typescript",
    "ecma_transforms_react",
    "ecma_transforms_typescript",
    "ecma_codegen",
] }
oxc_resolver = { version = "=11.23.0", default-features = false }
matchit = "0.8"
# next/image optimizer: decode, resize (SIMD), encode JPEG/PNG and lossy WebP
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
fast_image_resize = { version = "6.1", features = ["image"] }
webp = { version = "0.3", default-features = false }
# next/font: metrics of downloaded fonts for size-adjusted fallbacks (no layout shift)
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
# next/og: rasterizes the SVG Satori renders (text is already paths: no font features needed)
resvg = { version = "0.48", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
