[package]
name = "compiler-rs"
version = "0.1.0"
edition = "2021"
description = "High-performance App Router & Server Actions compiler & preview server for Com.AI.VN / NATA"

[lib]
name = "compiler_rs"
path = "src/lib.rs"

[[bin]]
name = "com-compiler"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
# `com build`: reads modules from the build server without a socket (`ServiceExt::oneshot`)
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "compression-br", "compression-gzip"] }
# `com start`: precompressed pages
brotli = { version = "8", default-features = false, features = ["std"] }
flate2 = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
regex = "1.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
walkdir = "2.5"
lightningcss = "1.0.0-alpha.72"
# Native Tailwind CSS v4 (instead of @tailwindcss/node in the Bun worker)
tailwind-rs = { path = "tailwind" }
rayon = "1.10"
mimalloc = { version = "0.1", default-features = false }
blake3 = "1"
redb = "2"
notify = "6.1"
swc_core = { version = "79.0.0", features = [
    "common",
    "ecma_ast",
    "ecma_visit",
    "ecma_parser",
    "ecma_parser_typescript",
    "ecma_transforms_react",
    "ecma_transforms_typescript",
    "ecma_transforms_module",
    "ecma_helpers_inline",
    "ecma_codegen",
] }
oxc_resolver = { version = "=11.23.0", default-features = false }
matchit = "0.8"
# next/image optimizer: decode, resize (SIMD), encode JPEG/PNG and lossy WebP
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
fast_image_resize = { version = "6.1", features = ["image"] }
webp = { version = "0.3", default-features = false }
# next/font: metrics of downloaded fonts for size-adjusted fallbacks (no layout shift)
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
# next/og: rasterizes the SVG Satori renders (text is already paths: no font features needed)
resvg = { version = "0.48", default-features = false }

# Day-to-day builds (`cargo build --release`, what `com dev` runs from target/release): fully
# optimized code, but compiled in parallel and incrementally, so a rebuild after a change is quick
[profile.release]
opt-level = 3
lto = false
codegen-units = 256
incremental = true
panic = "abort"
strip = true

# Published binaries (.github/workflows/release.yml): whole-program LTO in one codegen unit, smaller
# and a little faster, but every build re-optimizes everything (minutes)
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
incremental = false
