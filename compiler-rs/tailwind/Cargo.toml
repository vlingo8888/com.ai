[package]
name = "tailwind-rs"
version = "0.1.0"
edition = "2021"
description = "Native Tailwind CSS v4 compiler (vendored from NATA backend/tailwind-rs)"
publish = false

[lib]
name = "tailwind_rs"
path = "src/lib.rs"

[dependencies]
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
tracing = "0.1"
lru = "0.13"
memchr = "2.7"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
indexmap = "2"
globset = "0.4"
# The engine's version (compiler-rs uses alpha.72; NATA pins alpha.71 = npm lightningcss@1.32.0 for
# byte-identical minified output, which cannot coexist with it in one binary)
lightningcss = { version = "1.0.0-alpha.72", default-features = false }
